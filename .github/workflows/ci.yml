name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Zig 0.13.0 and JDK 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless xz-utils
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> $GITHUB_PATH
      - name: Run C & Java Host Unit Tests
        run: python3 cli/build_all.py --host-tests-only
      - name: Run CLI Self-Test
        run: python3 cli/volte_ctl.py self-test
      - name: Run Built-in AI Skill & Profile Self-Test
        run: |
          python3 .agents/skills/qcom32-volte/scripts/ai_device_helper.py self-test
          python3 .agents/skills/qcom32-volte/scripts/ai_device_helper.py validate-profile
      - name: Build & Test Official Website
        working-directory: website
        run: npm test
